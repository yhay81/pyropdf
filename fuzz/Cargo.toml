# cargo-fuzz targets of the store and the engine (DESIGN.md section 12, F9).
# The empty table below makes this directory a workspace of its own, built
# with a nightly toolchain, so the root workspace and its lockfile stay
# unchanged.
[workspace]

[package]
name = "pyropdf-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
pyropdf-engine = { path = "../crates/pyropdf-engine" }
pyropdf-store = { path = "../crates/pyropdf-store" }
skrifa = "0.49.0"

# The hayro commit of the root workspace's [patch.crates-io] (#18), which
# #603 removes with it.
[patch.crates-io]
hayro = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-ccitt = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-cmap = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-font = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-interpret = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-jbig2 = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-jpeg2000 = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-postscript = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-svg = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-syntax = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }

[[bin]]
name = "index"
path = "fuzz_targets/index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "value"
path = "fuzz_targets/value.rs"
test = false
doc = false
bench = false

[[bin]]
name = "save"
path = "fuzz_targets/save.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bridge"
path = "fuzz_targets/bridge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content"
path = "fuzz_targets/content.rs"
test = false
doc = false
bench = false

[[bin]]
name = "interpret"
path = "fuzz_targets/interpret.rs"
test = false
doc = false
bench = false

# Debug assertions and overflow checks find more, as cargo-fuzz builds them.
[profile.release]
debug = 1

[[bin]]
name = "fonts"
path = "fuzz_targets/fonts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bitmaps"
path = "fuzz_targets/bitmaps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "colr"
path = "fuzz_targets/colr.rs"
test = false
doc = false
bench = false
