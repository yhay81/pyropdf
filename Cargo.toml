[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.3.0"
authors = ["Yusuke Hayashi <yusuke8h@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/yhay81/pyropdf"
publish = false

# The crates of DESIGN.md section 11. A crate depends only on the crates that
# section lists before it; tests/test_crate_dependencies.py checks the graph.
[workspace.dependencies]
pyropdf-store = { path = "crates/pyropdf-store" }
pyropdf-schema = { path = "crates/pyropdf-schema" }
pyropdf-engine = { path = "crates/pyropdf-engine" }

# hayro 0.9.0 lacks `GlyphRun::font_dict()`, which groups glyphs by font
# (#584). Until a release contains LaurenzV/hayro#1734, every hayro crate
# comes from one commit, hayro main 4f7d16fa with #1734, since the crates
# name each other by path and their types agree only from one source.
# fuzz/Cargo.toml repeats this table. #603 removes both.
[patch.crates-io]
hayro = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-ccitt = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-cmap = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-font = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-interpret = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-jbig2 = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-jpeg2000 = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-postscript = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-svg = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }
hayro-syntax = { git = "https://github.com/yhay81/hayro", rev = "394e4a0d37baf8af513f6ebda15f4bada85d6f23" }

# The release profile of pylopdf, where thin LTO kept most of fat LTO's gains
# in size and speed without the regressions that fat LTO showed there.
[profile.release]
lto = "thin"
codegen-units = 1
# PyO3 converts Rust panics into Python exceptions only when they unwind.
panic = "unwind"
# Leave `strip` unset so Cargo removes only debug information. Symbol tables
# name frames in panic backtraces, debuggers, and profilers; in pylopdf,
# stripping them saved only 0.34 to 0.49 MiB per Linux or macOS wheel.

# hayro renders the corpus in the tests of pyropdf-engine; unoptimized, one
# page takes seconds. Optimizing the dependencies alone keeps the workspace's
# own code quick to rebuild.
[profile.dev.package."*"]
opt-level = 2
