[profile.release.package.weezl]
opt-level = "z"

[profile.release.package.moxcms]
opt-level = "z"

[profile.release.package.pic-scale]
opt-level = "z"

[profile.release.package.pxfm]
opt-level = "z"

[profile.release.package.brotli-decompressor]
opt-level = "z"

[profile.release.package.quick-xml]
opt-level = "z"

[profile.release.package.cms]
opt-level = "z"

[profile.release.package.x509-cert]
