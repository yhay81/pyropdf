{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {# The social plugin writes the other Open Graph and Twitter tags. #}
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f3ec">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15120f">
  <style>{% include "partials/pyropdf.css" %}</style>
  {% if page.meta and page.meta.home %}
    {# The home page has no source to edit or copy. #}
    <style>.md-content__button { display: none; }</style>
  {% endif %}
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    document.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-copy-command]");
      if (!button) return;
      const label = button.querySelector("[data-copy-label]");
      try {
        await navigator.clipboard.writeText(button.dataset.copyCommand);
      } catch {
        button.closest(".pp-install")?.querySelector("code")?.focus();
        return;
      }
      const previous = label.textContent;
      label.textContent = button.dataset.copiedLabel;
      window.setTimeout(() => { label.textContent = previous; }, 1600);
    });
  </script>
{% endblock %}
