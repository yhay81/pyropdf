# Release CI: build wheels for every platform and publish on a v* tag.
# `workflow_dispatch` builds and smoke-tests everything without publishing.
# macOS and Windows minutes cost several times Linux minutes, so this runs
# only on tags and by hand. Worker smoke changes also run the Linux WASM job on PRs.
#
# Publishing requires a Trusted Publisher configured on PyPI:
#   PyPI → project pyropdf → Publishing → GitHub
#   owner: yhay81 / repository: pyropdf / workflow: release.yml / environment: pypi
#
# The GitHub release is immutable, with its assets and tag locked and attested
# by GitHub, only while the repository enables release immutability:
#   Settings → General → Releases → Enable release immutability
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tools/build_pyodide.sh"
      - "tools/pyodide-build-requirements.txt"
      - "tools/smoke_artifact.py"
      - "tools/smoke_worker.py"
      - "tools/cloudflare/**"
  workflow_dispatch:
    inputs:
      pyodide_only:
        description: "Verify the Pyodide wheel in Node and local Cloudflare Workers"
        type: boolean
        default: false

permissions: {}

env:
  # rust-toolchain.toml pins the same toolchain; tests/test_release.py checks
  # that the pins agree.
  RUSTUP_TOOLCHAIN: 1.100.0
  CARGO_BUILD_JOBS: 2

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

  build-wheels:
    if: github.event_name != 'pull_request' && !inputs.pyodide_only
    name: wheel (${{ matrix.platform.target }})
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: "1.100.0"
          maturin-version: "1.16.0"
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Smoke-test installed wheel
        run: python tools/smoke_artifact.py dist --pattern "*.whl"
      # Exercise the same abi3 wheel on the newest supported CPython as well.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Smoke-test installed wheel on Python 3.15
        run: python tools/smoke_artifact.py dist --pattern "*.whl"
      - name: Attest wheel build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist

  build-free-threaded-wheels:
    if: github.event_name != 'pull_request' && !inputs.pyodide_only
    name: free-threaded wheel (${{ matrix.python.tag }}, ${{ matrix.platform.target }})
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Each free-threaded CPython gets a version-specific wheel, since the
        # abi3 wheel does not load on a free-threaded interpreter.
        python:
          - { version: "3.14t", tag: cp314t }
          - { version: "3.15t", tag: cp315t }
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python.version }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: "1.100.0"
          maturin-version: "1.16.0"
          args: --release --locked --out dist -i python${{ matrix.python.version }}
          manylinux: auto
      - name: Smoke-test installed free-threaded wheel
        run: python tools/smoke_artifact.py dist --pattern "*${{ matrix.python.tag }}*.whl"
      - name: Attest free-threaded wheel build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: free-threaded-wheels-${{ matrix.python.tag }}-${{ matrix.platform.target }}
          path: dist

  build-pyodide-wheel:
    name: Pyodide and Workers wheel
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.13.0"
      - name: Build and smoke-test the installed Pyodide wheel
        run: bash tools/build_pyodide.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Verify requests through local Cloudflare workerd
        run: bash tools/cloudflare/smoke.sh local dist/*-pyemscripten_2026_0_wasm32.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-pyodide
          path: dist/*.whl

  attest-pyodide-wheel:
    name: Attest the verified Pyodide and Workers wheel
    if: github.event_name != 'pull_request'
    needs: build-pyodide-wheel
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-pyodide
          path: dist
      - name: Attest Pyodide wheel build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl

  build-sdist:
    if: github.event_name != 'pull_request' && !inputs.pyodide_only
    name: sdist
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          rust-toolchain: "1.100.0"
          maturin-version: "1.16.0"
          args: --out dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Smoke-test installed sdist
        run: python tools/smoke_artifact.py dist --pattern "*.tar.gz"
      - name: Attest source distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-wheels, build-free-threaded-wheels, build-pyodide-wheel, attest-pyodide-wheel, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - run: mkdir -p release
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/
          format: spdx-json
          output-file: release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: release/sbom.spdx.json
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: release/sbom.spdx.json

  github-release:
    name: Create immutable GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      # With assets, gh creates a draft, uploads them, and then publishes it,
      # which is when the release becomes immutable.
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GITHUB_TOKEN cannot read the repository setting beforehand, so the
      # check reads the release that the previous step published.
      - name: Verify the release is immutable
        run: |
          immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .immutable)"
          if [ "${immutable}" != true ]; then
            echo "::error::${GITHUB_REF_NAME} is not immutable: enable release immutability in the repository settings."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
