# Release CI: build wheels for every platform and publish on a v* tag.
# `workflow_dispatch` builds and smoke-tests everything without publishing.
# macOS and Windows minutes cost several times Linux minutes, so this runs
# only on tags and by hand. Worker smoke changes also run the Linux WASM job on PRs.
#
# Publishing requires a Trusted Publisher configured on PyPI:
#   PyPI → project pyropdf → Publishing → GitHub
#   owner: yhay81 / repository: pyropdf / workflow: release.yml / environment: pypi
#
# The GitHub release is immutable, with its assets and tag locked and attested
# by GitHub, only while the repository enables release immutability:
#   Settings → General → Releases → Enable release immutability
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tools/build_pyodide.sh"
      - "tools/pyodide-build-requirements.txt"
      - "tools/smoke_artifact.py"
      - "tools/smoke_worker.py"
      - "tools/cloudflare/**"
  workflow_dispatch:
    inputs:
      pyodide_only:
        description: "Verify the Pyodide wheel in Node and local Cloudflare Workers"
        type: boolean
        default: false
      capability_rehearsal:
        description: "Rehearse only the checked capability declaration for this example version tag"
        type: string
        default: ""

permissions: {}

env:
  # rust-toolchain.toml pins the same toolchain; tests/test_release.py checks
  # that the pins agree.
  RUSTUP_TOOLCHAIN: 1.100.0
  CARGO_BUILD_JOBS: 2

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check comparison coverage on a mixed-outcome fixture
        run: python3 -m unittest discover -s evidence/pymupdf-comparison -p test_release_comparison.py
      - name: Verify tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

  capability-declaration:
    name: Verify the release capability declaration
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.capability_rehearsal != '')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the declaration and replay its exact candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL_TAG: ${{ inputs.capability_rehearsal }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          tag="$GITHUB_REF_NAME"
          mode=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$REHEARSAL_TAG"
            mode+=(--rehearsal)
          else
            test "$(git rev-parse "refs/tags/${tag}^{commit}")" = "$revision"
          fi
          args=(--tag "$tag" --revision "$revision" "${mode[@]}")
          evidence=()
          needs_evidence="$(python3 tools/spec_map/declaration.py needs-evidence "${args[@]}")"
          if [[ "$needs_evidence" == true ]]; then
            run_id="$(gh run list --workflow ci.yml --commit "$revision" --status success \
              --json databaseId,event --jq 'map(select(.event == "push" or .event == "workflow_dispatch")) | first.databaseId // empty')"
            test -n "$run_id" || { echo "::error::Missing successful CI for $revision"; exit 1; }
            gh run download "$run_id" --name release-evidence --dir "$RUNNER_TEMP/observations"
            evidence+=(--evidence "$RUNNER_TEMP/observations/release-evidence.json")
          fi
          python3 tools/spec_map/declaration.py build "${args[@]}" "${evidence[@]}" --output release/capabilities.zip
          mkdir "$RUNNER_TEMP/verify-capabilities"
          unzip -q release/capabilities.zip -d "$RUNNER_TEMP/verify-capabilities"
          cd "$RUNNER_TEMP/verify-capabilities"
          python3 tools/spec_map/declaration.py verify --tag "$tag" --revision "$revision" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-capabilities
          path: release/capabilities.zip
          if-no-files-found: error

  build-wheels:
    if: github.event_name != 'pull_request' && !inputs.pyodide_only && !inputs.capability_rehearsal
    name: wheel (${{ matrix.platform.target }})
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the native release build
        id: native
        shell: bash
        run: |
          # The host replaces the wheel after the manylinux container writes it.
          mkdir -p dist
          args=$(cat tools/native-wheel-args.txt)
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: "1.100.0"
          maturin-version: "1.16.0"
          args: ${{ steps.native.outputs.args }}
          manylinux: auto
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Recompress the native abi3 wheel
        run: uv run --locked --only-group wheel --python 3.14 python tools/repack_wheel.py dist
      - name: Check compressed abi3 wheel size and licenses
        run: python tools/wheel_size.py dist --abi abi3
      - name: Smoke-test installed wheel
        run: python tools/smoke_artifact.py dist --pattern "*.whl"
      # Exercise the same abi3 wheel on the newest supported CPython as well.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Smoke-test installed wheel on Python 3.15
        run: python tools/smoke_artifact.py dist --pattern "*.whl"
      - name: Attest wheel build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist

  build-free-threaded-wheels:
    if: github.event_name != 'pull_request' && !inputs.pyodide_only && !inputs.capability_rehearsal
    name: free-threaded wheel (${{ matrix.python.tag }}, ${{ matrix.platform.target }})
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Each free-threaded CPython gets a version-specific wheel, since the
        # abi3 wheel does not load on a free-threaded interpreter.
        python:
          - { version: "3.14t", tag: cp314t }
          - { version: "3.15t", tag: cp315t }
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python.version }}
      - name: Read native release arguments
        id: native
        shell: bash
        run: |
          args=$(cat tools/native-wheel-args.txt)
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: "1.100.0"
          maturin-version: "1.16.0"
          args: ${{ steps.native.outputs.args }} -i python${{ matrix.python.version }}
          manylinux: auto
      - name: Report free-threaded wheel size and check licenses
        run: python tools/wheel_size.py dist --abi ${{ matrix.python.tag }}
      - name: Smoke-test installed free-threaded wheel
        run: python tools/smoke_artifact.py dist --pattern "*${{ matrix.python.tag }}*.whl"
      - name: Attest free-threaded wheel build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: free-threaded-wheels-${{ matrix.python.tag }}-${{ matrix.platform.target }}
          path: dist

  build-pyodide-wheel:
    if: ${{ !inputs.capability_rehearsal }}
    name: Pyodide and Workers wheel
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.13.0"
      - name: Build and smoke-test the installed Pyodide wheel
        run: bash tools/build_pyodide.sh
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Verify requests through local Cloudflare workerd
        run: bash tools/cloudflare/smoke.sh local dist/*-pyemscripten_2026_0_wasm32.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-pyodide
          path: dist/*.whl

  attest-pyodide-wheel:
    name: Attest the verified Pyodide and Workers wheel
    if: github.event_name != 'pull_request'
    needs: build-pyodide-wheel
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-pyodide
          path: dist
      - name: Attest Pyodide wheel build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl

  build-sdist:
    if: github.event_name != 'pull_request' && !inputs.pyodide_only && !inputs.capability_rehearsal
    name: sdist
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          rust-toolchain: "1.100.0"
          maturin-version: "1.16.0"
          args: --out dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Smoke-test installed sdist
        run: python tools/smoke_artifact.py dist --pattern "*.tar.gz"
      - name: Attest source distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist

  compare-release:
    name: Compare the release artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-x86_64-unknown-linux-gnu
          path: dist
      - name: Compare the release wheel with the current PyMuPDF wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^)"
          archive="comparison-${previous}.zip"
          assets="$(gh release view "$previous" --json assets --jq '.assets[].name')"
          if grep -Fxq "$archive" <<< "$assets"; then
            gh release download "$previous" -p "$archive" -D "$RUNNER_TEMP"
            unzip -p "$RUNNER_TEMP/$archive" comparison/observations.json > "$RUNNER_TEMP/previous.json"
            previous_report="$RUNNER_TEMP/previous.json"
          else
            previous_report="evidence/pymupdf-comparison/releases/${previous}-darwin-arm64/observations.json"
          fi
          python -m pip download --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/oracle" pymupdf
          python evidence/pymupdf-comparison/release.py "$GITHUB_REF_NAME" \
            dist/pyropdf-*-abi3-manylinux*x86_64.whl "$RUNNER_TEMP"/oracle/pymupdf-*.whl "$RUNNER_TEMP/comparison" \
            --previous-report "$previous_report"
          mkdir -p release
          python -m zipfile -c "release/comparison-${GITHUB_REF_NAME}.zip" "$RUNNER_TEMP/comparison"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-comparison
          path: release/comparison-*.zip
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-wheels, build-free-threaded-wheels, build-pyodide-wheel, attest-pyodide-wheel, build-sdist, compare-release, capability-declaration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{*wheels-*,sdist}"
          merge-multiple: true
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: startsWith(github.ref, 'refs/tags/v1.0.')
        with:
          path: candidate
          persist-credentials: false
      - name: Check the 1.0 specification map and minimum workflows on the built wheels
        if: startsWith(github.ref, 'refs/tags/v1.0.')
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          run_id="$(gh run list --workflow ci.yml --commit "$revision" --status success \
            --json databaseId,event --jq 'map(select(.event == "push" or .event == "workflow_dispatch")) | first.databaseId // empty')"
          test -n "$run_id" || { echo "::error::No successful CI run for $revision"; exit 1; }
          record="$RUNNER_TEMP/minimum"
          mkdir -p "$record"
          gh run download "$run_id" --name release-evidence --dir "$record"
          source="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          echo "$source" > "$record/observations-source.txt"
          echo "Reading candidate observations from $source"
          if gh api "repos/$GITHUB_REPOSITORY/contents/evidence/releases/$GITHUB_REF_NAME/workflows.json?ref=$source" \
              -H "Accept: application/vnd.github.raw+json" > "$RUNNER_TEMP/workflows.json"; then
            mv "$RUNNER_TEMP/workflows.json" "$record/workflows.json"
          else
            echo "::error::Could not read workflow observations at $source; reporting the missing cases."
          fi
          for issue in 15 243; do
            gh issue view "$issue" --json number,state,stateReason
          done | jq -s 'map({key: (.number|tostring), value: {state, stateReason}}) | from_entries' > "$record/issue-states.json"
          python3 tools/spec_map/claim.py --release "$GITHUB_REF_NAME" --revision "$revision" \
            --evidence "$record/release-evidence.json" --workflow-results "$record/workflows.json" \
            --artifacts "$GITHUB_WORKSPACE/dist" --issue-states "$record/issue-states.json" | tee "$record/report.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v1.0.') }}
        with:
          name: minimum-workflows
          path: ${{ runner.temp }}/minimum/
      - run: mkdir -p release
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: dist/
          format: spdx-json
          output-file: release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: release/sbom.spdx.json
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: release/sbom.spdx.json

  github-release:
    name: Create immutable GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{*wheels-*,sdist,release-capabilities,release-comparison,release-sbom}"
          path: release-assets
          merge-multiple: true
      # With assets, gh creates a draft, uploads them, and then publishes it,
      # which is when the release becomes immutable.
      - name: Create GitHub release
        run: |
          unzip -p release-assets/capabilities.zip RELEASE-NOTES.md > "$RUNNER_TEMP/capability-notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes-file "$RUNNER_TEMP/capability-notes.md" release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GITHUB_TOKEN cannot read the repository setting beforehand, so the
      # check reads the release that the previous step published.
      - name: Verify the release is immutable
        run: |
          immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .immutable)"
          if [ "${immutable}" != true ]; then
            echo "::error::${GITHUB_REF_NAME} is not immutable: enable release immutability in the repository settings."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
