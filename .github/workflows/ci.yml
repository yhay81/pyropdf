# Rust and Python checks, and an audit of the dependencies and the workflows,
# on Linux, for every pull request and every push to main. Other systems join
# only when an issue needs macOS or Windows.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to a pull request supersedes its earlier run; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Preserve rustup and tools installed outside cargo install.
          cache-bin: false
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked

  python:
    name: Python ${{ matrix.python }}
    # Allow a cold build followed by the full floor suite or an external reader.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      PYROPDF_REQUIRE_QPDF: "1"
    strategy:
      fail-fast: false
      matrix:
        # The floor of the abi3-py311 extension, the newest CPython, and its
        # free-threaded build, for which PyO3 builds a version-specific
        # extension (DESIGN.md section 4.6).
        python: ["3.11", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Keep one cache per interpreter: PyO3 rebuilds for each.
          key: python-${{ matrix.python }}
          # Preserve rustup and tools installed outside cargo install.
          cache-bin: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          cache-suffix: python-${{ matrix.python }}
      - name: Install independent PDF readers and raster devices
        # qpdf checks saved objects, Poppler renders fonts and RGB colours,
        # and Ghostscript supplies spot plates, screening and CMYK controls.
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends qpdf poppler-utils ghostscript
      - name: Build and install
        # Install the wheel rather than an editable build, so that the tests
        # import what a release would ship.
        run: uv sync --locked --no-editable-package pyropdf --python ${{ matrix.python }}
      - name: Lint
        if: matrix.python == '3.11'
        run: uv run --no-sync ruff check .
      - name: Format
        if: matrix.python == '3.11'
        run: uv run --no-sync ruff format --check .
      - name: Type check
        # ty checks the Python 3.11 floor from project.requires-python.
        if: matrix.python == '3.11'
        run: uv run --no-sync ty check
      - name: Test the full corpus
        if: matrix.python == '3.11'
        run: uv run --no-sync pytest -rs --junitxml=target/ci-evidence/pytest.xml -o "junit_suite_name=pyropdf-${GITHUB_SHA}"
      - name: Test with a representative corpus
        if: matrix.python != '3.11'
        run: uv run --no-sync pytest --quick-corpus -rs
      - name: Validate the PDF/A and PDF/UA corpora and their saves with veraPDF
        # One Python suffices: the saved bytes do not depend on it. The
        # runner's Java runs the jars, pinned by their SHA-256; the Arlington
        # build checks each file against the Arlington PDF Model.
        if: matrix.python == '3.15'
        run: |
          python3 tools/fetch_verapdf.py
          uv run --no-sync python tools/verapdf.py --jar target/verapdf/greenfield-apps.jar \
            --arlington target/verapdf/greenfield-apps-arlington.jar
          mkdir -p target/ci-evidence
          git rev-parse HEAD > target/ci-evidence/verapdf-revision
      - name: Read every save of the corpus with pdf.js
        # pdf.js is a development-only reader oracle (tools/oracles.py); the
        # runner's Node installs it from tools/pdfjs's lockfile without
        # install scripts. Its optional canvas package provides the DOMMatrix
        # that pdf.js needs in Node.
        if: matrix.python == '3.15t'
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/pdfjs
          uv run --no-sync python tools/oracles.py --readers pdfjs
          mkdir -p target/ci-evidence
          git rev-parse HEAD > target/ci-evidence/pdfjs-revision
      - name: Upload this interpreter's release evidence inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-evidence-${{ matrix.python }}
          path: target/ci-evidence/
          if-no-files-found: error
          overwrite: true

  evidence:
    name: Release evidence
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-evidence-*
          path: target
      - name: Record exact-revision release evidence
        run: |
          test "$(cat target/python-evidence-3.15/verapdf-revision)" = "$GITHUB_SHA"
          test "$(cat target/python-evidence-3.15t/pdfjs-revision)" = "$GITHUB_SHA"
          python3 tools/spec_map/release_evidence.py target/python-evidence-3.11/pytest.xml target/release-evidence.json \
            --verapdf success --pdfjs success
      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: target/release-evidence.json
          if-no-files-found: error
          overwrite: true

  audit:
    name: Audit
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned cargo-audit and actionlint
        id: tools
        run: bash tools/install_audit_tools.sh
      - name: Audit Cargo.lock against the RustSec advisory database
        # Only the workspace's Cargo.lock, which pins what ships: no release
        # builds the measurement workspaces under evidence/. Warnings fail
        # too, such as an unmaintained, unsound, or yanked crate. Through
        # `cargo audit`, rustup would first install the toolchain of
        # rust-toolchain.toml, which the audit does not need.
        run: cargo-audit audit --deny warnings
      - name: Validate the workflows
        # Run after a failed audit too, so that one run reports both. The
        # shellcheck and pyflakes that actionlint would call are not pinned.
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: actionlint -shellcheck= -pyflakes=
