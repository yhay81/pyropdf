# Layout model wheel release CI: publish pyropdf-layout-models on a layout-models-v* tag.
#
# Publishing requires a Trusted Publisher configured on PyPI:
#   PyPI -> project pyropdf-layout-models -> Publishing -> GitHub
#   owner: yhay81 / repository: pyropdf / workflow: release-layout-models.yml / environment: pypi
name: Release layout models

on:
  push:
    tags: ["layout-models-v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build and attest pyropdf-layout-models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Verify package versions and release tag
        id: package
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("models/pyropdf-layout-models/pyproject.toml", "rb"))["project"]["version"])')"
          module_version="$(PYTHONPATH=models/pyropdf-layout-models/src python -c 'import pyropdf_layout_models; print(pyropdf_layout_models.__version__)')"
          test "${package_version}" = "${module_version}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF_TYPE}" = "tag" ]]; then
            test "layout-models-v${package_version}" = "${GITHUB_REF_NAME}"
          fi
      - name: Convert and verify PP-DocLayout_plus-L INT8 RTen artifact
        run: |
          uv run --no-project --with onnx==1.23.2 --with onnxruntime==1.32.0 --with rten-convert==0.22.0 \
            python models/pyropdf-layout-models/scripts/convert_model.py \
            --work-dir "${RUNNER_TEMP}/layout-convert" \
            --out-dir models/pyropdf-layout-models/src/pyropdf_layout_models \
            --verify
      - name: Verify bundled model checksums
        working-directory: models/pyropdf-layout-models/src/pyropdf_layout_models
        run: sha256sum --check SHA256SUMS
      - name: Build sdist and wheel
        run: uv build models/pyropdf-layout-models --out-dir dist
      - name: Verify reproducible distributions
        run: |
          uv build models/pyropdf-layout-models --out-dir dist-repro
          for artifact in dist/*.whl dist/*.tar.gz; do
            cmp "${artifact}" "dist-repro/$(basename "${artifact}")"
          done
      - name: Validate distribution metadata
        run: uvx --from twine==7.0.0 twine check dist/*
      - name: Smoke-test installed wheel and sdist
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            case "${artifact}" in
              *.whl) kind="wheel" ;;
              *) kind="sdist" ;;
            esac
            environment=".venv-smoke-${kind}"
            uv venv --no-project "${environment}"
            uv pip install --python "${environment}/bin/python" "${artifact}"
            "${environment}/bin/python" tools/smoke_layout_models_artifact.py \
              --version "${{ steps.package.outputs.version }}"
          done
      - run: mkdir -p release
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/
          format: spdx-json
          output-file: release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: release/sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-models-dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-models-sbom
          path: release/sbom.spdx.json

  publish:
    name: Publish pyropdf-layout-models
    if: startsWith(github.ref, 'refs/tags/layout-models-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: layout-models-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create immutable GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
