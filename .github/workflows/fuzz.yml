# The cargo-fuzz targets of fuzz/ (DESIGN.md section 12, F9): a short run on
# pull requests that change the store, the engine, or the targets, and a
# longer weekly run. A crash fails the job and uploads its input. Linux only:
# Actions minutes are limited, and fuzz/README.md states the budget.
name: Fuzz

on:
  pull_request:
    paths:
      - "crates/pyropdf-store/**"
      - "crates/pyropdf-engine/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Mondays at 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # cargo-fuzz needs a nightly toolchain; pinning one keeps runs comparable.
  NIGHTLY: nightly-2026-10-10
  CARGO_FUZZ: 0.13.2

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `interpret` joins after the adoption of a hayro release after 0.8.0
        # (#7), whose known panics it finds (#19).
        target: [index, value, save, bridge, content]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo +"$NIGHTLY" install cargo-fuzz --locked --version "$CARGO_FUZZ"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
          cache-bin: false
      - name: Write the seeds
        run: python3 -I fuzz/seeds.py
      - name: Fuzz
        working-directory: fuzz
        env:
          # Seconds: one minute on pull requests, fifteen weekly.
          SECONDS_TO_RUN: ${{ github.event_name == 'pull_request' && 60 || 900 }}
        run: >-
          cargo +"$NIGHTLY" fuzz run "${{ matrix.target }}" "corpus/${{ matrix.target }}"
          -- -max_total_time="$SECONDS_TO_RUN" -timeout=10 -rss_limit_mb=2048 -max_len=4194304
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
