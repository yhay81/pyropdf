# The cargo-fuzz targets of fuzz/ (DESIGN.md section 12, F9): a short run on
# pull requests and pushes to main that change the store, the engine, or the
# targets, and a longer weekly run on Linux. A crash fails the job and uploads
# its input.
name: Fuzz

on:
  pull_request:
    paths:
      - "crates/pyropdf-store/**"
      - "crates/pyropdf-engine/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
    paths:
      - "crates/pyropdf-store/**"
      - "crates/pyropdf-engine/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Mondays at 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  # A push to a pull request supersedes its earlier run; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # cargo-fuzz needs a nightly toolchain; pinning one keeps runs comparable.
  NIGHTLY: nightly-2026-11-03
  CARGO_FUZZ: 0.13.2

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [index, value, save, bridge, content, fonts, bitmaps, colr, interpret]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo +"$NIGHTLY" install cargo-fuzz --locked --version "$CARGO_FUZZ"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
          cache-bin: false
      - name: Write the seeds
        run: python3 -I fuzz/seeds.py
      - name: Fuzz
        working-directory: fuzz
        env:
          # Seconds: one minute on pull requests, fifteen weekly.
          SECONDS_TO_RUN: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 60 || 900 }}
        run: >-
          cargo +"$NIGHTLY" fuzz run "${{ matrix.target }}" "corpus/${{ matrix.target }}"
          -- -max_total_time="$SECONDS_TO_RUN" -timeout=10 -rss_limit_mb=2048 -max_len=4194304
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
