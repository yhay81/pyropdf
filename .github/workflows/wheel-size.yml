# Compare actual release-mode wheels, including platform-specific changes. Both
# builds use the same runner, toolchain, maturin, interpreter and compatibility tag.
name: Wheel size

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - Cargo.*
      - .cargo/**
      - .gitattributes
      - crates/**
      - python/**
      - pyproject.toml
      - rust-toolchain.toml
      - README.md
      - LICENSE
      - NOTICE
      - tools/arlington/**
      - tools/wheel_size.py
      - tools/repack_wheel.py
      - uv.lock
      - tools/native-wheel-args.txt
      - .github/workflows/release.yml
      - .github/workflows/wheel-size.yml

permissions:
  contents: read

# New source pushes supersede older source runs immediately. An edit has its
# own group so a delayed justification check cannot cancel a newer comparison.
concurrency:
  group: wheel-size-${{ github.event.action == 'edited' && format('edit-{0}', github.run_id) || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  edited-inputs:
    name: Check edited wheel inputs
    if: >-
      github.event.action == 'edited' &&
      (github.event.changes.base != null ||
      (github.event.changes.body != null &&
      (contains(github.event.changes.body.from, 'Wheel growth justification:') ||
      contains(github.event.pull_request.body, 'Wheel growth justification:'))))
    runs-on: ubuntu-latest
    outputs:
      compare: ${{ steps.inputs.outputs.compare }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: inputs
        shell: bash
        run: |
          python - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          from tools.wheel_size import comparison_inputs_changed

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          print("compare=" + str(comparison_inputs_changed(event)).lower())
          PYTHON

  compare:
    name: Compare abi3 (${{ matrix.platform.target }})
    needs: edited-inputs
    if: >-
      ${{ !cancelled() &&
      (github.event.action != 'edited' || needs.edited-inputs.outputs.compare == 'true') }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GitHub tests the PR applied to its current base, including packaging
          # changes that landed after the contributor branched.
          ref: ${{ github.sha }}
          path: head
          fetch-depth: 2
          persist-credentials: false
      - name: Identify the exact base of the tested merge
        id: base
        shell: bash
        run: |
          revision=$(git -C head rev-parse HEAD^1)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.revision }}
          path: base
          persist-credentials: false
      - name: Read native release arguments from each revision
        id: native
        shell: bash
        run: |
          for checkout in base head; do
            # Releases before #858 passed these flags directly in release.yml.
            if [[ $checkout == base && ! -f base/tools/native-wheel-args.txt ]]; then
              args='--release --locked --out dist'
            else
              args=$(cat "$checkout/tools/native-wheel-args.txt")
            fi
            echo "$checkout=$args" >> "$GITHUB_OUTPUT"
          done
      - name: Build base release wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: base
          target: ${{ matrix.platform.target }}
          rust-toolchain: "1.100.0"
          maturin-version: "1.16.0"
          args: ${{ steps.native.outputs.base }}
          manylinux: auto
      - name: Build head release wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: head
          target: ${{ matrix.platform.target }}
          rust-toolchain: "1.100.0"
          maturin-version: "1.16.0"
          args: ${{ steps.native.outputs.head }}
          manylinux: auto
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Apply each revision's release wheel packaging
        shell: bash
        run: |
          for checkout in base head; do
            if [[ -f "$checkout/tools/repack_wheel.py" ]]; then
              (cd "$checkout" && uv run --locked --only-group wheel --python 3.14 python tools/repack_wheel.py dist)
            fi
          done
      - name: Check compressed size and growth
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REVISION: ${{ steps.base.outputs.revision }}
          HEAD_REVISION: ${{ github.sha }}
        shell: bash
        run: python head/tools/wheel_size.py head/dist --abi abi3 --base base/dist | tee size.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abi3-size-${{ matrix.platform.target }}
          path: size.json
