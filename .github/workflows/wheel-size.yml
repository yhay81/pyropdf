# Compare actual release-mode wheels, including platform-specific changes. Both
# builds use the same runner, toolchain, maturin, interpreter and compatibility tag.
name: Wheel size

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - Cargo.*
      - crates/**
      - python/**
      - pyproject.toml
      - rust-toolchain.toml
      - README.md
      - LICENSE
      - NOTICE
      - tools/arlington/**
      - tools/wheel_size.py
      - .github/workflows/release.yml
      - .github/workflows/wheel-size.yml

permissions:
  contents: read

concurrency:
  group: wheel-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare abi3 (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - name: Build base release wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: base
          target: ${{ matrix.platform.target }}
          rust-toolchain: "1.100.0"
          maturin-version: "1.16.0"
          args: --release --locked --out dist
          manylinux: auto
      - name: Build head release wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: head
          target: ${{ matrix.platform.target }}
          rust-toolchain: "1.100.0"
          maturin-version: "1.16.0"
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Check compressed size and growth
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: python head/tools/wheel_size.py head/dist --abi abi3 --base base/dist | tee size.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abi3-size-${{ matrix.platform.target }}
          path: size.json
