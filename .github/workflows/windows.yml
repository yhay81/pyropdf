# Saving on Windows: the target's access control list and long paths (issue
# #60). Windows minutes count several times as much as Linux, so this runs on
# demand and when the save code changes, as the owner approved for #60.
name: Windows

on:
  pull_request:
    paths:
      - "python/pyropdf/_document.py"
      - "crates/pyropdf-python/src/windows_permissions.rs"
      - "crates/pyropdf-python/src/document.rs"
      - "crates/pyropdf-python/Cargo.toml"
      - "crates/pyropdf-store/src/save/**"
      - "tests/test_windows_save.py"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  save:
    name: Windows save
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows
          cache-bin: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          cache-suffix: windows
      - name: Build and install
        run: uv sync --locked --no-editable-package pyropdf --python 3.11
      - name: Test saving
        run: uv run --no-sync pytest tests/test_windows_save.py tests/test_document.py
