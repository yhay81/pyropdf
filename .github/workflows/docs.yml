# Build the documentation site (English and Japanese) on pull requests, and
# deploy it from main as static assets of a Cloudflare Worker (wrangler.jsonc). Ported from pylopdf's docs workflow.
# The API reference is committed (tools/api_reference.py), so no Rust build
# is needed here; tests/test_docs.py keeps it and the examples current.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs.ja.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
      - "wrangler.jsonc"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs.ja.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
      - name: Install the docs toolchain (no Rust build)
        run: uv sync --locked --only-group docs --no-install-project
      - name: Build the English site (strict)
        run: uv run --no-sync zensical build -f mkdocs.yml -c -s
      - name: Build the Japanese site (strict)
        run: uv run --no-sync zensical build -f mkdocs.ja.yml -c -s
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://pyropdf.haya.works/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    concurrency:
      group: cloudflare
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      # Skipped until the owner adds the secrets, so main stays green.
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
