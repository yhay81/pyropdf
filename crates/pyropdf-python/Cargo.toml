[package]
name = "pyropdf-python"
description = "The Python binding of pyropdf"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
# Python tests in tests/ cover the binding. A Rust test harness would have to
# link libpython, which the extension module never does.
test = false
doctest = false

[dependencies]
pyropdf-engine.workspace = true
pyropdf-schema.workspace = true
pyropdf-store.workspace = true
# PNG output of Pixmap, the version that hayro already pulls in.
flate2 = "1.1.10"
png = "0.18.1"
# JPEG output of Pixmap and doc.render, as pylopdf encodes it.
jpeg-encoder = "0.7.0"
# JPEG input of Pixmap.from_bytes, the version that hayro already pulls in.
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
# GIF, TIFF, and JPEG 2000 input of Pixmap.from_bytes (#446). hayro already
# pulls in the JPEG 2000 decoder, and TIFF reuses its Deflate, LZW, and JPEG
# decoders.
gif = { version = "0.14.2", default-features = false, features = ["std"] }
hayro-jpeg2000 = { version = "0.4.1", default-features = false, features = ["std", "simd"] }
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "jpeg", "lzw", "fax"] }
# maturin sets PYO3_BUILD_EXTENSION_MODULE, which replaces PyO3's deprecated
# extension-module feature.
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }

# Saving keeps a Windows target's access control list (issue #60).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
