# The clippy configuration of the crates under `crates/`. Clippy reads the
# first `clippy.toml` that it meets going up from the manifest of the crate
# that it checks, so this file binds every crate here that has no
# `clippy.toml` of its own, and nothing outside this directory: `fuzz/` and
# the evidence crates, which `tools/check.py` does not lint, find no
# configuration, and a checkout nested in this one, such as a worktree under
# `.claude/`, never reads this file in place of its own. pyropdf-engine and
# pyropdf-python keep an empty file of their own until #676 and #677 adopt
# this one; tests/test_clippy_config.py lists the crates that it binds.
#
# A collection that grows from input grows through the operation's budget
# (DESIGN.md F6 and section 9): a `BudgetVec`, whose growth is fallible and
# charged to the budget. The methods below grow a collection or size a new
# one, so a bound crate uses none of them. Where something else bounds the
# growth, such as the caller, a constant, or the generated Arlington model,
# the use expects the lint, and the reason says what bounds it:
#
#     #[expect(clippy::disallowed_methods, reason = "...")]
#
# The unit tests grow collections freely: the lib.rs of each bound crate
# allows the lint under `cfg(test)`. A test target with a crate root of its
# own allows it there.
disallowed-methods = [
    # Vec, and `vec![value; n]`, which calls `from_elem`.
    { path = "std::vec::Vec::with_capacity", reason = "input-derived growth goes through `BudgetVec` (DESIGN.md F6); expect this lint with a reason where growth is bounded otherwise" },
