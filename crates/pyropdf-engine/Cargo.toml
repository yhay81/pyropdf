[package]
name = "pyropdf-engine"
description = "Interpretation, rendering, writing, and understanding over the pyropdf store"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Every engine reads the document through the store (DESIGN.md F1).
pyropdf-store.workspace = true
hayro = "0.8.0"
hayro-svg = "0.8.0"
# The font tables that hayro already reads, for the line metrics of text.
skrifa = "0.46.2"
# The bidirectional classes of the reading order of text.
unicode-bidi = "0.3.18"
# The Standard 14 fonts' Adobe metrics, and the break opportunities and
# graphemes of the text that they lay out, as pylopdf draws form text.
pdf-base14-metrics = "0.0.2"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
# PP-OCR inference in pure Rust, with pylopdf's pins (DESIGN.md section 14).
rten = { version = "0.27.0", default-features = false, features = ["rten_format"] }
rten-tensor = "0.27.0"
# PAdES signatures (issue #397; evidence/signing): the CMS and X.509
# structures of the RustCrypto next line, without cms's builder feature,
# which pulls in the rsa crate and RUSTSEC-2023-0071. RSA keys sign through
# a callback outside pyropdf.
cms = { version = "0.3.0-rc.0", default-features = false }
der = { version = "0.8.3", features = ["alloc", "derive", "oid", "pem"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["pem"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pem"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pem"] }
# Encrypted PKCS#8 keys and the PBES2 bags of PKCS#12, and the HMAC of a
# PKCS#12 file's MAC.
pkcs8 = { version = "0.11.0", features = ["encryption", "pem"] }
sha2 = "0.11.1"
hmac = "0.13.0"
harfrust = "0.13.3"
unicode-script = "0.5"

[dev-dependencies]
# Property tests of the bridge (DESIGN.md F9).
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
