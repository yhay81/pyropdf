[package]
name = "pyropdf-store"
description = "The versioned object store of pyropdf"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The one parser of every object (DESIGN.md F5). The store decodes no image,
# so the `images` feature and its decoders stay off.
hayro-syntax = { version = "0.9.0", default-features = false, features = ["std"] }

# The primitives of the standard security handler (DESIGN.md section 4.5),
# MIT OR Apache-2.0 as the repository's license allows.
aes = "0.9.4"
md-5 = "0.11.0"
sha2 = "0.11.1"
# ISO 32000-2 algorithm for the V4 AESV2 recipient file key.
sha1 = "0.11.0"
# Fresh AES initialization vectors for recipient ciphertext.
getrandom = "0.4.3"
# ISO/TS 32004:2024 PDF MAC uses the same CMS types as the signing engine.
cms = { version = "0.3.0-rc.2", default-features = false }
der = { version = "0.8.3", features = ["alloc", "derive", "oid"] }
x509-cert = { version = "0.3.0", default-features = false }
aes-kw = { version = "0.3.1", default-features = false }
hkdf = "0.13.0"
hmac = "0.13.0"
sha3 = { version = "0.11.0", default-features = false }

# The Flate encoder of a save that compresses streams (DESIGN.md section
# 4.4), the version that the binding and hayro already pull in.
flate2 = "1.1.11"

[dev-dependencies]
# Property tests of the store's invariants (DESIGN.md F9).
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
