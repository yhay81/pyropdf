[package]
name = "pyropdf-store"
description = "The versioned object store of pyropdf"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The one parser of every object (DESIGN.md F5). The store decodes no image,
# so the `images` feature and its decoders stay off.
hayro-syntax = { version = "0.8.0", default-features = false, features = ["std"] }

[dev-dependencies]
# Property tests of the store's invariants (DESIGN.md F9).
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
