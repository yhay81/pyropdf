# The clippy configuration of pyropdf-store. Clippy reads the configuration
# of the crate that it checks, so this file binds this crate alone.
#
# A collection that grows from input grows through the operation's budget
# (DESIGN.md F6 and section 9): a `BudgetVec`, whose growth is fallible and
# charged to the budget. The methods below grow a collection or size a new
# one, so the store uses none of them. Where something else bounds the
# growth, such as the caller or a constant, the use expects the lint, and the
# reason says what bounds it:
#
#     #[expect(clippy::disallowed_methods, reason = "...")]
#
# The unit tests grow collections freely: lib.rs allows the lint under
# `cfg(test)`. A test target with a crate root of its own allows it there.
disallowed-methods = [
    # Vec, and `vec![value; n]`, which calls `from_elem`.
    { path = "std::vec::Vec::with_capacity", reason = "input-derived growth goes through `BudgetVec` (DESIGN.md F6); expect this lint with a reason where growth is bounded otherwise" },
    { path = "std::vec::Vec::push", reason = "input-derived growth goes through `BudgetVec` (DESIGN.md F6); expect this lint with a reason where growth is bounded otherwise" },
