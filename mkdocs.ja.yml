site_name: pyropdf
site_url: https://pyropdf.haya.works/ja/
site_description: PDF を、Python の書き心地と Rust の芯で。pyropdf は版付きオブジェクトストアの上で、Python から PDF を読み、描画し、編集し、署名します。どの変更も取り消せ、失敗した編集は文書を元のまま残します。
site_author: Yusuke Hayashi
copyright: Copyright &copy; 2026 Yusuke Hayashi · MIT License
repo_url: https://github.com/yhay81/pyropdf
repo_name: yhay81/pyropdf
edit_uri: edit/main/docs/ja/
docs_dir: docs/ja
site_dir: site/ja

theme:
  name: material
  variant: modern
  language: ja
  custom_dir: docs/overrides
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/fire
    repo: fontawesome/brands/github
    alternate: material/translate
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - content.action.copy
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え

nav:
  - ホーム: index.md
  - ガイド:
      - はじめに: getting-started.md
      - 概念: concepts.md
      - 内容を読む: reading.md
      - 描画: rendering.md
      - 編集: editing.md
      - 版と保存: versions.md
      - 制限とエラー: limits.md
      - レシピ: recipes.md
  - API リファレンス（英語）: https://pyropdf.haya.works/api/
  - プロジェクト:
      - pyropdf を選ぶ: choosing.md
      - 状態と安全性: status.md
      - 仕様の対応状況: specification.md
      - 設計: https://github.com/yhay81/pyropdf/blob/main/DESIGN.md
      - 変更履歴: https://github.com/yhay81/pyropdf/blob/main/CHANGELOG.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # The glossary: its abbreviations show as tooltips on every page.
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
      auto_append:
        - includes/abbreviations.ja.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  # Hovering a link to a heading of these pages previews it in place.
  - zensical.extensions.preview:
      configurations:
        - targets:
            include:
              - concepts.md
              - limits.md

plugins:
  - search
  # Serve the Google Fonts from the site itself. Only the fonts: the theme's
  # bundle also names video and lightbox scripts that no page loads, and the
  # plugin would otherwise download them and the ad SDK that they load.
  - privacy:
      assets_include:
        - fonts.googleapis.com/*
        - fonts.gstatic.com/*
  # llms.txt, llms-full.txt, and a Markdown copy of each listed page; the
  # theme's content.action.copy shows "Copy as Markdown" on those pages.
  - llmstxt:
      markdown_description: >-
        ガイドは概念と作業を、プロジェクトのテストで実行される例とともに説明します。
        API リファレンスは英語のみで、https://pyropdf.haya.works/llms.txt にあります。
      full_output: llms-full.txt
      sections:
        ガイド:
          - getting-started.md
          - concepts.md
          - reading.md
          - rendering.md
          - editing.md
          - versions.md
          - limits.md
          - recipes.md
        プロジェクト:
          - choosing.md
          - status.md
          - specification.md
  # A social card and Open Graph metadata for every page.
  - social:
      cards_layout_options:
        background_color: "#15120f"
        color: "#f1ebe0"
        font_family: Noto Sans JP
  - minify:
      minify_html: true
      minify_inline_css: true
      minify_inline_js: true

extra:
  current_language: ja
  alternate:
    - name: English
      link: https://pyropdf.haya.works/
      lang: en
    - name: 日本語
      link: https://pyropdf.haya.works/ja/
      lang: ja
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yhay81/pyropdf
      name: GitHub の pyropdf
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyropdf/
      name: PyPI の pyropdf
