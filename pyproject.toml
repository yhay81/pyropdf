[project]
name = "pyropdf"
# maturin reads the version of crates/pyropdf-python, which the workspace sets.
dynamic = ["version"]
description = "A Python library, implemented in Rust, for complete control of PDF as ISO 32000-2 defines it."
authors = [{ name = "Yusuke Hayashi", email = "yusuke8h@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "tools/arlington/model/LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/yhay81/pyropdf"
Issues = "https://github.com/yhay81/pyropdf/issues"
Source = "https://github.com/yhay81/pyropdf"

[build-system]
# maturin 1.9.4 and later set PYO3_BUILD_EXTENSION_MODULE for PyO3.
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/pyropdf-python/Cargo.toml"
python-source = "python"
module-name = "pyropdf._core"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    # ty is pre-1.0 and its diagnostics change between releases; uv.lock pins
    # the version that CI runs.
    "ty>=0.0.91",
]

[tool.uv]
# Cache keys that make uv rebuild the extension after its Rust sources,
# manifests, or toolchain change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust-toolchain.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spec(feature, *dimensions): the test proves the feature in those dimensions of the specification map (tools/spec_map)",
]

[tool.ty.src]
# Check the package, its tests, and the repository's tools. ty reads the
# Python 3.11 floor from project.requires-python.
include = ["python", "tests", "tools"]

[tool.ruff]
line-length = 120
src = ["python"]
# Markdown examples stay hand-aligned, as in DESIGN.md section 10.
# evidence/pylopdf-baseline keeps pylopdf's measurement scripts as they ran for
# DESIGN.md section 2.1. tools/arlington/generate.py writes typed.pyi, and
# tests/test_arlington_schema.py checks it.
extend-exclude = ["*.md", "evidence/pylopdf-baseline", "python/pyropdf/typed.pyi"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The repository-level license covers source files without repeated headers.
    "CPY001",
    "D100",
    "D104",
    # Rules that conflict with ruff format.
    "COM812",
    "ISC001",
    "D203",
    "D213",
    # CJK test data intentionally contains ambiguous Unicode characters.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001", "S101", "D103", "PLR2004"]
# The tools are scripts, not a package.
"tools/**" = ["INP001"]
