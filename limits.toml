[codes.ocr_layer_character_count]
message = "the OCR layer has too many distinct characters"
unit = "characters"
default = 65_534
reached = "An invisible OCR layer needs more than 65,534 distinct character IDs."

[codes.ocr_raster_size]
message = "the OCR raster is too large"
unit = "bytes"
default = 536_870_912
reached = "The raster expanded to RGBA for OCR exceeds 512 MiB."

[codes.ocr_detection_count]
message = "the OCR detector found too many text regions"
unit = "regions"
default = 4_096
reached = "OCR detection finds more than 4,096 candidate regions across its tiles before merging overlaps."

[codes.ocr_text_size]
message = "the recognized OCR text is too long"
unit = "bytes"
default = 33_554_432
reached = "OCR recognition produces more than 32 MiB of UTF-8 text before confidence filtering."

[codes.ocr_model_size]
message = "the OCR model set is too large"
unit = "bytes"
default = 67_108_864
reached = "The detector, recognizer, and dictionary that `OcrEngine` loads hold more bytes together than its `max_model_size`."

[codes.ocr_dictionary_entries]
message = "the OCR dictionary has too many entries"
unit = "entries"
default = 65_536
reached = "The dictionary that `OcrEngine` loads has more lines than the limit."

