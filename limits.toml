# The registry of limit codes (DESIGN.md section 9).
#
# Each table under `codes` is a limit that refuses an operation, and its key
# is the stable code that Python's `LimitError.code` carries. The fields are:
#
# - `message`: how a refusal with the code reads, in lowercase and without a
#   final period. A refusal that knows the amount and the limit appends them.
# - `unit`: what the limit counts, in the plural. A code without a unit
#   refuses without numbers.
# - `default`: the limit that applies unless `DocumentLimits` or the call's
#   `max_*` option sets another. A code without a default has no limit until
#   one is set.
# - `reached`: when the code is reached, as one Markdown sentence for the
#   documentation.
#
# Codes that pylopdf has keep its names and meanings. They come from
# pylopdf's src/pylopdf/_limits.py, rust/src/document/limits.rs, and the call
# sites of `limit_err` at 884af0dbf21973cfd434a9eca4e769de62fcc25c.
#
# tools/generate_limits.py writes the Rust enum, the Python mapping, and the
# table of the security guide from this file, and
# tests/test_limit_codes.py fails when they are stale. After a change, run:
#
#     uv run python tools/generate_limits.py

# Opening, and the structure of the document.

[codes.file_size]
message = "the input is too large"
unit = "bytes"
reached = "The input is larger than `DocumentLimits.max_file_size`."

[codes.page_count]
message = "the document has too many pages"
unit = "pages"
reached = "The document has more pages than `DocumentLimits.max_pages`."

[codes.object_count]
message = "the document has too many objects"
unit = "objects"
reached = "The document has more objects than `DocumentLimits.max_objects`."

[codes.object_depth]
message = "an object nests arrays and dictionaries too deeply"
unit = "levels"
reached = "An object nests arrays and dictionaries deeper than `DocumentLimits.max_object_depth`."

# Decoding streams.

[codes.decompressed_size]
message = "a stream decodes to too many bytes"
unit = "bytes"
reached = "A stream decodes to more than `DocumentLimits.max_decompressed_size`."

[codes.page_content_size]
message = "a page content stream decodes to too many bytes"
unit = "bytes"
reached = "A content stream of a page decodes to more than `DocumentLimits.max_page_content_size`."

[codes.total_decompressed_size]
message = "the streams of the operation decode to too many bytes"
unit = "bytes"
reached = "The streams that one operation decodes are larger together than `DocumentLimits.max_total_decompressed_size`."

[codes.decompression_unverifiable]
message = "the decoded size of a stream cannot be bounded"
reached = "A stream uses a filter whose decoded size cannot be bounded while a decoding limit applies."

[codes.stream_filter_count]
message = "a stream chains too many filters"
unit = "filters"
default = 16
reached = "A stream chains more filters than its limit."

# Interpretation.

[codes.interpretation_size]
message = "the data handed to the interpreter is too large"
unit = "bytes"
reached = "The PDF data handed to the interpreter is larger than `DocumentLimits.max_interpretation_size`."

[codes.interpretation_fuel]
message = "interpretation needs too much work"
unit = "units of fuel"
reached = "Interpretation uses more fuel than the operation allows."

# Content streams as operations.

[codes.content_operation_count]
message = "the content holds too many operations"
unit = "operations"
default = 1_048_576
reached = "Content holds more operations than the call's `max_operations`, or `Page.operations` reads more than 1,048,576."

[codes.content_stream_size]
message = "the page's content is too large"
unit = "bytes"
default = 67_108_864
reached = "A page's content streams, decoded and joined, are larger than 64 MiB when `Page.operations` reads them."

[codes.content_input_size]
message = "the content is too large to parse"
unit = "bytes"
default = 67_108_864
reached = "The content that `Operations.parse` reads is larger than the call's `max_size`, or the content that an assignment to `Page.operations` writes is larger than 64 MiB."

[codes.content_element_count]
message = "the page paints too many items"
unit = "elements"
default = 262_144
reached = "`Page.content` reads more glyphs, path and clip segments, dash lengths, and items than the call's `max_elements`."

[codes.text_glyph_count]
message = "the page holds too many glyphs to read as text"
unit = "glyphs"
default = 262_144
reached = "`Page.text`, `Page.words`, `Page.layout`, or `Document.text` collects more glyphs of one page than the call's `max_glyphs`."

[codes.text_size]
message = "the text is too large"
unit = "bytes"
default = 67_108_864
reached = "The UTF-8 of a page's glyphs, of the text that `Page.text` or `Document.text` returns, or of the strings of the records that `Page.words` or `Page.layout` returns, is larger than the call's `max_size`."

[codes.search_input_size]
message = "the search text is too long"
unit = "bytes"
default = 4_096
reached = "The text that `Page.search` looks for is longer than 4,096 bytes in UTF-8."

[codes.search_hit_count]
message = "the search finds too many matches"
unit = "matches"
default = 4_096
reached = "`Page.search` finds more matches than the call's `max_hits`."

[codes.text_rule_count]
message = "the page has too many vector rules to read"
unit = "rules"
default = 4_096
reached = "Styled text or table extraction collects more than 4,096 vector rules, including inferred table dividers."

[codes.table_cell_count]
message = "the candidate table has too many cells"
unit = "cells"
default = 4_096
reached = "A candidate table needs more than 4,096 row-column slots."

[codes.table_span_candidate_count]
message = "the table needs too many cell span candidates"
unit = "candidates"
default = 65_536
reached = "Reconstructing merged cells in one table examines more than 65,536 candidate spans."

[codes.table_column_count]
message = "the text table has too many columns"
unit = "columns"
default = 32
reached = "Text table detection encounters a row with more than 32 separated columns."

[codes.ocr_layer_word_count]
message = "the OCR layer has too many words"
unit = "words"
default = 4_096
reached = "An invisible OCR layer has more than 4,096 words."

[codes.ocr_layer_text_size]
message = "the OCR layer text is too long"
unit = "bytes"
default = 1_048_576
