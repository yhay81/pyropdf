# Builds against a krilla checkout with krilla-object-sink.patch applied,
# which build.sh prepares under target/krilla-sink/. Not a workspace member.
[package]
name = "krilla-sink-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
krilla = { path = "../../../target/krilla-sink/krilla/crates/krilla" }
pyropdf-store = { path = "../../../crates/pyropdf-store" }

[workspace]
