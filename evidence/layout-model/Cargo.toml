[workspace]

[package]
name = "pyropdf-layout-model-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
png = "0.18.1"
rten = { version = "0.28.0", default-features = false, features = ["rten_format"] }
rten-tensor = "0.28.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
